<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>4HB Operator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #111111;
  --surface2: #1a1a1a;
  --surface3: #222222;
  --border: #2a2a2a;
  --accent: #c8ff00;
  --accent2: #ff6b35;
  --accent3: #00d4ff;
  --text: #f0f0f0;
  --text2: #888888;
  --text3: #555555;
  --red: #ff4444;
  --green: #44ff88;
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --display: 'Bebas Neue', sans-serif;
  --radius: 8px;
  --transition: 0.18s ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

/* ─── LAYOUT ─── */
#app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
#main-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 16px 16px 80px;
}
#nav-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 10px 4px;
  background: none;
  border: none;
  color: var(--text3);
  font-family: var(--sans);
  font-size: 10px;
  cursor: pointer;
  transition: color var(--transition);
}
.nav-btn.active { color: var(--accent); }
.nav-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }

/* ─── HEADER ─── */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.page-title {
  font-family: var(--display);
  font-size: 32px;
  letter-spacing: 1px;
  color: var(--text);
}
.page-subtitle {
  font-size: 11px;
  color: var(--text2);
  font-family: var(--mono);
  letter-spacing: 0.5px;
}

/* ─── CARDS ─── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.card-title {
  font-family: var(--display);
  font-size: 18px;
  letter-spacing: 0.5px;
  color: var(--text);
}
.card-label {
  font-size: 10px;
  font-family: var(--mono);
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ─── ACCENT CARD ─── */
.card-accent {
  background: var(--surface);
  border: 1px solid var(--accent);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.card-accent2 { border-color: var(--accent2); border-left-color: var(--accent2); }
.card-accent3 { border-color: var(--accent3); border-left-color: var(--accent3); }

/* ─── BUTTONS ─── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 18px;
  border-radius: var(--radius);
  border: none;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: #000;
}
.btn-primary:active { transform: scale(0.97); }
.btn-secondary {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-danger { background: var(--red); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 11px; }
.btn-full { width: 100%; }
.btn-icon {
  background: none;
  border: none;
  color: var(--text2);
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: color var(--transition);
}
.btn-icon:active { color: var(--accent); }
.btn-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }

/* ─── FORMS ─── */
.form-group { margin-bottom: 14px; }
.form-label {
  display: block;
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 6px;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  padding: 10px 12px;
  outline: none;
  transition: border-color var(--transition);
  -webkit-appearance: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--accent);
}
.form-textarea { resize: vertical; min-height: 80px; }
.form-select option { background: var(--surface2); }

/* ─── TOGGLE ─── */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.toggle-row:last-child { border-bottom: none; }
.toggle-info h4 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.toggle-info p { font-size: 11px; color: var(--text2); line-height: 1.4; }
.toggle {
  position: relative;
  width: 42px;
  height: 24px;
  flex-shrink: 0;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute;
  inset: 0;
  background: var(--surface3);
  border-radius: 24px;
  cursor: pointer;
  transition: background var(--transition);
}
.toggle-slider::before {
  content: '';
  position: absolute;
  width: 18px;
  height: 18px;
  left: 3px;
  top: 3px;
  background: var(--text2);
  border-radius: 50%;
  transition: all var(--transition);
}
.toggle input:checked + .toggle-slider { background: var(--accent); }
.toggle input:checked + .toggle-slider::before {
  transform: translateX(18px);
  background: #000;
}

/* ─── STAT GRID ─── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 12px;
}
.stat-grid-3 { grid-template-columns: repeat(3, 1fr); }
.stat-box {
  background: var(--surface2);
  border-radius: var(--radius);
  padding: 12px;
  border: 1px solid var(--border);
}
.stat-value {
  font-family: var(--display);
  font-size: 26px;
  color: var(--accent);
  line-height: 1;
}
.stat-label {
  font-size: 10px;
  color: var(--text2);
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 4px;
}

/* ─── BADGE ─── */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-family: var(--mono);
  font-weight: 500;
  letter-spacing: 0.5px;
}
.badge-green { background: rgba(68,255,136,0.15); color: var(--green); }
.badge-yellow { background: rgba(200,255,0,0.15); color: var(--accent); }
.badge-orange { background: rgba(255,107,53,0.15); color: var(--accent2); }
.badge-blue { background: rgba(0,212,255,0.15); color: var(--accent3); }
.badge-red { background: rgba(255,68,68,0.15); color: var(--red); }

/* ─── PROGRESS BAR ─── */
.progress-bar {
  height: 4px;
  background: var(--surface3);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 6px;
}
.progress-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--accent);
  transition: width 0.4s ease;
}

/* ─── SECTION DIVIDER ─── */
.section-divider {
  font-size: 10px;
  font-family: var(--mono);
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 12px 0 8px;
}

/* ─── WORKOUT ITEM ─── */
.workout-step {
  display: flex;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.workout-step:last-child { border-bottom: none; }
.step-num {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--surface3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text2);
  flex-shrink: 0;
  margin-top: 2px;
}
.step-num.active { background: var(--accent); color: #000; }
.step-num.done { background: var(--green); color: #000; }
.step-content h4 { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
.step-content p { font-size: 12px; color: var(--text2); }
.step-content a { color: var(--accent3); font-size: 11px; text-decoration: none; }
.step-meta { font-size: 11px; color: var(--accent); font-family: var(--mono); margin-top: 4px; }

/* ─── LOG INPUT ─── */
.log-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.log-row:last-child { border-bottom: none; }
.log-label { font-size: 12px; font-weight: 500; flex: 1; min-width: 0; }
.log-input {
  width: 72px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  padding: 6px 8px;
  text-align: center;
  outline: none;
  transition: border-color var(--transition);
}
.log-input:focus { border-color: var(--accent); }
.log-unit { font-size: 11px; color: var(--text3); width: 28px; }

/* ─── MODAL ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition);
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px 16px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform 0.3s ease;
  border-top: 1px solid var(--border);
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-handle {
  width: 36px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 16px;
}
.modal-title {
  font-family: var(--display);
  font-size: 22px;
  margin-bottom: 16px;
}

/* ─── TIMER ─── */
.timer-display {
  font-family: var(--display);
  font-size: 64px;
  color: var(--accent);
  text-align: center;
  letter-spacing: 2px;
  padding: 20px 0;
  line-height: 1;
}

/* ─── CHART PLACEHOLDER ─── */
.chart-area {
  height: 120px;
  background: var(--surface2);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  display: flex;
  align-items: flex-end;
  padding: 8px;
  gap: 3px;
  overflow: hidden;
}
.chart-bar {
  flex: 1;
  border-radius: 2px 2px 0 0;
  min-height: 4px;
  transition: height 0.3s ease;
}

/* ─── TABS ─── */
.tab-row {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  background: var(--surface2);
  padding: 4px;
  border-radius: var(--radius);
}
.tab-btn {
  flex: 1;
  padding: 7px 8px;
  border: none;
  border-radius: 6px;
  background: none;
  color: var(--text2);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  text-align: center;
}
.tab-btn.active {
  background: var(--surface);
  color: var(--text);
}

/* ─── PAGE ─── */
.page { display: none; }
.page.active { display: block; }

/* ─── TODAY HERO ─── */
.today-hero {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 16px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.today-hero::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 80px; height: 80px;
  background: radial-gradient(circle, rgba(200,255,0,0.08) 0%, transparent 70%);
}
.today-day {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.today-workout {
  font-family: var(--display);
  font-size: 28px;
  letter-spacing: 1px;
  color: var(--text);
  margin-bottom: 8px;
}
.today-meta {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--text2);
  font-family: var(--mono);
}
.today-meta span { color: var(--accent2); }

/* ─── SCROLLABLE CONTENT AREAS ─── */
.scroll-x {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.scroll-x::-webkit-scrollbar { display: none; }

/* ─── SEPARATOR ─── */
hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

/* ─── SMALL TEXT UTILS ─── */
.mono { font-family: var(--mono); }
.text-accent { color: var(--accent); }
.text-accent2 { color: var(--accent2); }
.text-accent3 { color: var(--accent3); }
.text-muted { color: var(--text2); }
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }
.text-center { text-align: center; }
.flex { display: flex; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.mb-4 { margin-bottom: 4px; }
.mb-8 { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }
.mt-4 { margin-top: 4px; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.fw-600 { font-weight: 600; }

/* ─── ACCORDION ─── */
.accordion-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.accordion-header h4 { font-size: 13px; font-weight: 600; }
.accordion-header .chev {
  width: 16px; height: 16px;
  stroke: var(--text2);
  fill: none;
  stroke-width: 2;
  transition: transform var(--transition);
}
.accordion-header.open .chev { transform: rotate(180deg); }
.accordion-body { display: none; padding: 12px 0; }
.accordion-body.open { display: block; }

/* ─── SCROLLABLE PILL ROW ─── */
.pill-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 4px;
  margin-bottom: 12px;
}
.pill-row::-webkit-scrollbar { display: none; }
.pill {
  flex-shrink: 0;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-family: var(--mono);
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text2);
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--transition);
}
.pill.active { background: var(--accent); color: #000; border-color: var(--accent); }

/* ─── LIST ITEM ─── */
.list-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.list-item:last-child { border-bottom: none; }
.list-item-info { flex: 1; min-width: 0; }
.list-item-info h4 { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item-info p { font-size: 11px; color: var(--text2); }
.list-item-meta { font-size: 11px; color: var(--text2); font-family: var(--mono); text-align: right; flex-shrink: 0; }

/* Loading indicator */
.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Meal compliance dot */
.compliance-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  display: inline-block;
}
.compliance-dot.green { background: var(--green); }
.compliance-dot.red { background: var(--red); }
.compliance-dot.yellow { background: var(--accent); }

/* Flash animation for saved state */
@keyframes flash { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.flashing { animation: flash 0.4s ease; }

</style>
</head>
<body>
<div id="app">
  <div id="main-content"></div>
  <nav id="nav-bar">
    <button class="nav-btn active" data-page="today" onclick="navigate('today')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Today
    </button>
    <button class="nav-btn" data-page="log" onclick="navigate('log')">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Log
    </button>
    <button class="nav-btn" data-page="nutrition" onclick="navigate('nutrition')">
      <svg viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
      Nutrition
    </button>
    <button class="nav-btn" data-page="progress" onclick="navigate('progress')">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Progress
    </button>
    <button class="nav-btn" data-page="settings" onclick="navigate('settings')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </button>
  </nav>
</div>

<!-- MODALS -->
<div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// DATA STORE
// ═══════════════════════════════════════════════════════════════
const DB_KEY = '4hb_app_v1';

const DEFAULT_SETTINGS = {
  // Profile
  name: '',
  bodyweight: 0,
  heightIn: 70,
  bodyFatPct: 20,
  
  // Training days (0=Sun, 1=Mon, ... 6=Sat)
  trainingDays: [1, 2, 4, 5, 6], // Mon,Tue,Thu,Fri,Sat
  includeSunday: false,
  
  // Components
  useStrength: true,
  useRunning: true,
  useCore: true,
  usePosterior: true,
  useMobility: true,
  useNutrition: true,
  
  // Strength (Geek to Freak)
  strengthProgram: 'g2f', // g2f | custom
  g2fCurrentWeek: 1,
  g2fTestDone: false,
  
  // Running

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // Merge with defaults for new fields
      return {
        ...DEFAULT_STATE,
        ...parsed,
        settings: { ...DEFAULT_SETTINGS, ...parsed.settings }
      };
    }
  } catch(e) { console.error('DB load error', e); }
  return { ...DEFAULT_STATE, settings: { ...DEFAULT_SETTINGS } };
}

function saveDB() {
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(db));
  } catch(e) { console.error('DB save error', e); }
}

// DATE HELPERS
// ═══════════════════════════════════════════════════════════════
function today() { return new Date().toISOString().split('T')[0]; }
function todayDate() { return new Date(); }
function formatDate(d) {
  const date = new Date(d + 'T00:00:00');
  return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function getDayName(d) {
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return days[new Date(d + 'T00:00:00').getDay()];
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
}
function getWeekStart(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  d.setDate(d.getDate() - day);
  return d.toISOString().split('T')[0];
}

// SCHEDULING ENGINE
// ═══════════════════════════════════════════════════════════════
function generateWeeklySchedule(weekStart) {
  const s = db.settings;
  const days = [];
  
  for (let i = 0; i < 7; i++) {
    const dateStr = addDays(weekStart, i);
    const dayOfWeek = new Date(dateStr + 'T00:00:00').getDay();
    
    if (!s.trainingDays.includes(dayOfWeek)) {
      days.push({ date: dateStr, type: 'rest', label: 'Rest Day', duration: 0, components: [] });
      continue;
    }
    
    const components = [];
    let label = '';
    let duration = 0;
    
    // Strength: 2x/week, Mon+Thu style
    const strengthDays = s.trainingDays.slice(0, 2);
    const isStrengthDay = s.useStrength && strengthDays.includes(dayOfWeek);
    
    // Running: 3x/week, spread through training days
    const runDaysAvail = s.trainingDays.filter(d => !strengthDays.includes(d));
    const runDays = s.useRunning ? runDaysAvail.slice(0, Math.min(3, runDaysAvail.length)) : [];
    const isRunDay = runDays.includes(dayOfWeek);
    
    // Determine run type for this day
    let runType = 'easy';
    const runDayIndex = runDays.indexOf(dayOfWeek);
    if (runDayIndex === 1) runType = 'easy2'; // second easy run
    if (runDayIndex === 2) runType = 'intervals'; // interval run
    
    if (isStrengthDay) {
      components.push('strength');
      duration += 45;
      label = 'Strength';
    }
    if (isRunDay) {
      components.push('running');
      duration += runType === 'intervals' ? 30 : 50;
      label = label ? label + ' + Run' : 'Run';
    }
    if (s.useCore && (isStrengthDay || (isRunDay && runType === 'easy'))) {
      components.push('core');
      duration += 8;
      if (isStrengthDay) label += ' + Core';
    }
    if (s.usePosterior && isStrengthDay) {
      components.push('posterior');
      duration += 15;
      label += ' + Swings';
    }
    if (s.useMobility) {
      // Add mobility to non-strength, non-run days, or as a warm-up
      const isExtraDay = !isStrengthDay && !isRunDay;
      if (isExtraDay || (isRunDay && !isStrengthDay)) {
        components.push('mobility');
        duration += 10;
        if (!label) label = 'Mobility';
      }
    }
    
    if (!label) { label = 'Active Recovery'; }
    
    days.push({ date: dateStr, type: 'training', label, duration, components, runType: isRunDay ? runType : null });
  }
  
  return days;
}

function getTodaySchedule() {
  const t = today();
  const weekStart = getWeekStart(t);
  if (!db.weekly_plan || db.currentWeek !== weekStart) {
    db.weekly_plan = generateWeeklySchedule(weekStart);
    db.currentWeek = weekStart;
    saveDB();
  }
  return db.weekly_plan.find(d => d.date === t) || { type: 'rest', label: 'Rest Day', components: [], duration: 0 };
}

function getWeekSchedule() {
  const t = today();
  const weekStart = getWeekStart(t);
  if (!db.weekly_plan || db.currentWeek !== weekStart) {
    db.weekly_plan = generateWeeklySchedule(weekStart);
    db.currentWeek = weekStart;
    saveDB();
  }
  return db.weekly_plan;
}

// PROGRESSION ENGINE
// ═══════════════════════════════════════════════════════════════
function getExerciseData(exerciseName) {
  const logs = db.workouts.filter(w => w.type === 'strength' && w.data && w.data.find(e => e.name === exerciseName));
  if (!logs.length) return null;
  return logs[logs.length - 1].data.find(e => e.name === exerciseName);
}

function getNextWeight(exerciseName, exerciseDef) {
  const last = getExerciseData(exerciseName);
  if (!last) {
    // Check if test day was done
    if (!db.settings.g2fTestDone) {
      return `TEST DAY — find starting weight`;
    }
    return `${exerciseDef.startWeight.male}`;
  }
  const reps = parseInt(last.reps) || 0;
  const weight = parseFloat(last.weight) || 0;
  if (reps >= 10) {
    return `${weight + exerciseDef.increment} lbs (+${exerciseDef.increment})`;
  } else if (reps < 5) {
    return `${Math.round(weight * 0.9)} lbs (deload -10%)`;
  }
  return `${weight} lbs (maintain)`;
}

function getCurrentRunDistance() {
  const logs = db.running_log.filter(r => r.type === 'easy' || r.type === 'easy2');
  if (!logs.length) return db.settings.runningStartDistance;
  const lastWeekLogs = logs.slice(-3);
  const avgDist = lastWeekLogs.reduce((a, b) => a + (b.distance || 0), 0) / lastWeekLogs.length;
  return Math.round(avgDist * (1 + db.settings.runningProgressionPct / 100) * 10) / 10;
}

function getMAFHR() {
  const age = db.settings.age || 35;
  return 180 - age;
}

// ═══════════════════════════════════════════════════════════════
function calcAutoNutrition() {
  const bw = db.settings.bodyweight || 180;
  if (db.settings.nutritionPlan === 'g2f') {
    return {
      calories: G2F.caloricTarget(bw),
      protein: G2F.proteinTarget(bw),
    };
  }
  // Slow-carb: ~1g protein per lb, 500 cal deficit (or maintenance for bulking)
  return {
    calories: Math.round(bw * 15),
    protein: Math.round(bw * 1.0),
  };
}

function getTodayNutritionLog() {
  return db.nutrition_log.find(n => n.date === today());
}

function getOrCreateTodayNutrition() {
  let log = db.nutrition_log.find(n => n.date === today());
  if (!log) {
    log = { date: today(), meals: [], water: 0, calories: 0, protein: 0, compliant: true, notes: '' };
    db.nutrition_log.push(log);
  }
  return log;
}

function getMealById(id) {
  return db.meals.find(m => m.id === id);
}

function calcMealMacros(meal) {
  if (!meal || !meal.ingredients) return { calories: 0, protein: 0, carbs: 0, fat: 0 };
  return meal.ingredients.reduce((acc, mi) => {
    const ing = db.ingredients.find(i => i.id === mi.ingredientId);
    if (!ing) return acc;
    const mult = (mi.servings || 1);
    acc.calories += Math.round(((ing.protein * 4) + (ing.carbs * 4) + (ing.fat * 9)) * mult);
    acc.protein += Math.round((ing.protein || 0) * mult);
    acc.carbs += Math.round((ing.carbs || 0) * mult);
    acc.fat += Math.round((ing.fat || 0) * mult);
    return acc;
  }, { calories: 0, protein: 0, carbs: 0, fat: 0 });
}

}

function renderMobilityWorkout() {
  const areas = db.settings.mobilityAreas || ['shoulders', 'hips', 'wrists'];
  let html = `<div class="card mb-12">
    <div class="card-header mb-8">
      <div>
        <div class="card-title">Mobility</div>
        <div class="text-xs text-muted mono">${areas.map(a => a.charAt(0).toUpperCase() + a.slice(1)).join(', ')}</div>
      </div>
      <span class="badge badge-blue">~10 min</span>
    </div>`;
  areas.forEach(area => {
    const mob = MOBILITY[area];
    if (!mob) return;
    html += `<div class="section-divider">${mob.name}</div>`;
    mob.exercises.forEach(ex => {
      html += `<div class="workout-step">
        <div class="step-num" style="background:var(--accent3);color:#000;font-size:10px;">GO</div>
        <div class="step-content" style="flex:1">
          <h4>${ex.name}</h4>
          <p>${ex.duration} — ${ex.notes}</p>
        </div>
      </div>`;
    });
  });
  html += `<button class="btn btn-secondary btn-sm btn-full mt-12" onclick="markComponentDone('mobility')">Mark Mobility Done</button></div>`;
  return html;
}

// PAGE: TODAY
// ═══════════════════════════════════════════════════════════════
function renderToday() {
  const dayData = getTodaySchedule();
  const t = today();
  const latestM = getLatestMeasurements();
  const nutrition = getTodayNutritionLog();
  const autoNutrition = calcAutoNutrition();
  const isRestDay = dayData.type === 'rest';
  const isCheatDay = new Date(t + 'T00:00:00').getDay() === db.settings.cheatDay;

  let html = ``;
  
  // Hero
  html += `<div class="today-hero">
    <div class="today-day">${formatDate(t)}</div>
    <div class="today-workout">${dayData.label}</div>
    <div class="today-meta">
      ${!isRestDay ? `<div>⏱ ~${dayData.duration} min</div>` : ''}
      ${isCheatDay ? '<div><span>🍕 CHEAT DAY</span></div>' : ''}
      ${isRestDay ? '<div>Recovery • Stay active, stretch</div>' : ''}
    </div>
  </div>`;

  // Quick stats
  html += `<div class="stat-grid mb-12">
    <div class="stat-box">
      <div class="stat-value">${db.settings.bodyweight || '—'}</div>
      <div class="stat-label">Body Weight (lbs)</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" style="color:var(--accent2)">${nutrition ? nutrition.protein : '—'}</div>
      <div class="stat-label">Protein Today (g)</div>
    </div>
  </div>`;

  // Nutrition quick log
  html += `<div class="card mb-12">
    <div class="card-header mb-8">
      <div class="card-title">Today's Nutrition</div>
      ${isCheatDay ? '<span class="badge badge-orange">CHEAT DAY</span>' : ''}
    </div>
    <div class="flex-between mb-8">
      <div class="text-sm text-muted">Goal: ${autoNutrition.calories} cal / ${autoNutrition.protein}g protein</div>
      ${nutrition ? `<div class="text-sm text-accent">${nutrition.calories}cal / ${nutrition.protein}g</div>` : '<div class="text-sm text-muted">Not logged</div>'}
    </div>
    ${isCheatDay ? `<div class="text-xs text-muted mb-8">${SLOW_CARB.cheatDayTips}</div>` : ''}
    <div style="display:flex;gap:8px;">
      <button class="btn btn-secondary btn-sm" style="flex:1" onclick="openLogWeightModal()">Log Weight</button>
      <button class="btn btn-secondary btn-sm" style="flex:1" onclick="openLogMealModal()">Log Meal</button>
      <button class="btn btn-secondary btn-sm" style="flex:1" onclick="openLogWaterModal()">
        💧 ${nutrition ? nutrition.water : 0}oz
      </button>
    </div>
  </div>`;

  // Workout content
  if (!isRestDay && dayData.components.length > 0) {
    html += `<div class="section-divider">TODAY'S WORKOUT</div>`;
    dayData.components.forEach(c => {
      html += renderWorkoutComponent(c, dayData);
    });
  } else if (isRestDay) {
    html += `<div class="card text-center" style="padding:24px">
      <div style="font-size:32px;margin-bottom:8px">🌿</div>
      <div class="card-title mb-4">Rest & Recover</div>
      <div class="text-sm text-muted">Light walking, stretching, and hydration are great today. Your body grows during recovery.</div>
      <button class="btn btn-secondary btn-sm mt-12" onclick="openLogMeasurementsModal()">Take Measurements</button>
    </div>`;
  }

  // Sleep log
  html += `<div class="card mt-4">
    <div class="flex-between">
      <div class="card-title">Sleep</div>
      <button class="btn btn-secondary btn-sm" onclick="openLogSleepModal()">Log Sleep</button>
    </div>
    ${db.sleep_log.length ? (() => {
      const sl = db.sleep_log[db.sleep_log.length - 1];
      return `<div class="text-sm text-muted mt-8">Last: <span class="text-accent">${sl.hours}h</span> — ${sl.date}</div>`;
    })() : '<div class="text-sm text-muted mt-8">No sleep logged yet</div>'}
  </div>`;

  // Supplements
  const activeSupps = Object.entries({
    supPolicosanol: 'Policosanol',
    supALA: 'ALA',
    supGarlic: 'Garlic Extract',
    supGlutamine: 'L-Glutamine',
    supCreatine: 'Creatine',
    supCissus: 'Cissus QR',
    supCashews: '4 cashews before meals',
    supAirSquats: '90-sec air squats before/after eating',
  }).filter(([k]) => db.settings[k]);

  if (activeSupps.length) {
    html += `<div class="card mt-4">
      <div class="card-title mb-8">Today's Protocol</div>`;
    activeSupps.forEach(([,name]) => {
      html += `<div class="toggle-row">
        <div class="toggle-info"><h4>${name}</h4></div>
        <input type="checkbox" style="width:18px;height:18px;accent-color:var(--accent)">
      </div>`;
    });
    html += `</div>`;
  }

  // This week preview
  const weekSchedule = getWeekSchedule();
  html += `<div class="section-divider">THIS WEEK</div>
  <div class="card">`;
  weekSchedule.forEach(d => {
    const isToday = d.date === t;
    html += `<div class="list-item" style="${isToday ? 'background:rgba(200,255,0,0.04);margin:-0 -16px;padding:10px 16px;' : ''}">
      <div style="width:32px;flex-shrink:0;text-align:center">
        <div class="text-xs mono text-muted">${getDayName(d.date)}</div>
        <div class="text-sm fw-600 ${isToday ? 'text-accent' : ''}">${d.date.split('-')[2]}</div>
      </div>
      <div class="list-item-info">
        <h4 style="${isToday ? 'color:var(--accent)' : ''}">${d.label}</h4>
        <p>${d.components.join(', ') || 'rest'}</p>
      </div>
      <div class="list-item-meta">${d.duration ? d.duration + 'm' : ''}</div>
    </div>`;
  });
  html += `</div>`;

  return html;
}

  const allWorkouts = [...db.workouts, ...db.running_log].sort((a,b) => b.date.localeCompare(a.date));
  
  let html = `<div class="page-header">
    <div>
      <div class="page-title">Log</div>
      <div class="page-subtitle">TRAINING HISTORY</div>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="openQuickLogModal()">+ Entry</button>
  </div>`;

  // Measurements summary
  const latest = getLatestMeasurements();
  if (latest) {
    const ti = calcTotalInches(latest);
    html += `<div class="card mb-12">
      <div class="card-title mb-8">Latest Measurements</div>
      <div class="stat-grid stat-grid-3">
        <div class="stat-box">
          <div class="stat-value">${latest.weight || '—'}</div>
          <div class="stat-label">Weight</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" style="color:var(--accent2)">${ti.toFixed(1)}</div>
          <div class="stat-label">Total Inches</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" style="color:var(--accent3)">${latest.bodyFat || '—'}%</div>
          <div class="stat-label">Body Fat</div>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm btn-full mt-8" onclick="openLogMeasurementsModal()">Update Measurements</button>
    </div>`;
  } else {
    html += `<div class="card mb-12 text-center" style="padding:20px">
      <div class="text-sm text-muted mb-8">No measurements recorded yet</div>
      <button class="btn btn-primary btn-sm" onclick="openLogMeasurementsModal()">Record First Measurements</button>
    </div>`;
  }

  // Workout history
  html += `<div class="section-divider">WORKOUT HISTORY</div>`;
  
  if (!allWorkouts.length) {
    html += `<div class="card text-center" style="padding:24px">
      <div class="text-sm text-muted">No workouts logged yet.<br>Complete your first workout above!</div>
    </div>`;
  } else {
    html += `<div class="card">`;

      html += `<div class="list-item">
        <div style="width:36px;flex-shrink:0">
          <div class="badge ${isRun ? 'badge-orange' : 'badge-yellow'}" style="padding:4px 6px;font-size:9px">${isRun ? 'RUN' : 'STR'}</div>
        </div>
        <div class="list-item-info">
          <h4>${w.date} ${isRun ? (w.type === 'intervals' ? '— Intervals' : '— Easy Run') : '— Strength'}</h4>
          <p>${isRun ? `${w.distance}mi · ${w.duration}min · HR ${w.avgHR || '—'}` : (w.data ? `${w.data.length} exercises` : 'completed')}</p>
        </div>
        <button class="btn-icon" onclick="deleteWorkoutLog('${w.id || w.date}')">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>`;
    });
    html += `</div>`;
  }

  // Running log
  if (db.running_log.length) {
    html += `<div class="section-divider">RUNNING LOG</div>
    <div class="card">`;
    db.running_log.slice(-8).reverse().forEach(r => {
      html += `<div class="list-item">
        <div class="list-item-info">
          <h4>${r.date} — ${r.type === 'intervals' ? 'Intervals' : 'Easy Run'}</h4>
          <p>${r.distance} mi · ${r.duration} min · Avg HR: ${r.avgHR || '—'} bpm</p>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  // Measurements history
  if (db.measurements.length > 1) {
    html += `<div class="section-divider">MEASUREMENT HISTORY</div>
    <div class="card">`;
    db.measurements.slice(-6).reverse().forEach(m => {
      html += `<div class="list-item">
        <div class="list-item-info">
          <h4>${m.date}</h4>
          <p>Weight: ${m.weight}lbs · BF: ${m.bodyFat}% · TI: ${calcTotalInches(m).toFixed(1)}"</p>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  return html;
}

// ═══════════════════════════════════════════════════════════════
// PAGE: PROGRESS
// ═══════════════════════════════════════════════════════════════
function renderProgress() {
  const measurements = db.measurements;
  const latest = getLatestMeasurements();
  const firstM = measurements.length > 1 ? measurements[0] : null;
  
  let html = `<div class="page-header">
    <div>
      <div class="page-title">Progress</div>
      <div class="page-subtitle">TRENDS & ANALYTICS</div>
    </div>
  </div>`;

  // Body weight chart
  if (measurements.length > 1) {
    const weights = measurements.slice(-10).map(m => parseFloat(m.weight) || 0);
    const maxW = Math.max(...weights);
    const minW = Math.min(...weights);
    const range = maxW - minW || 1;
    
    html += `<div class="card mb-12">
      <div class="card-title mb-8">Body Weight Trend</div>
      <div class="chart-area">`;
    weights.forEach((w, i) => {
      const height = ((w - minW) / range * 80 + 10);
      html += `<div class="chart-bar" style="height:${height}px;background:${i === weights.length-1 ? 'var(--accent)' : 'var(--surface3)'}"></div>`;
    });
    html += `</div>
      <div class="flex-between mt-8">
        <div class="text-xs text-muted">${measurements[Math.max(0, measurements.length-10)].date}</div>
        <div class="text-xs text-accent mono">${latest.weight} lbs</div>
      </div>
    </div>`;
  }

  // Key metrics
  if (latest && firstM) {
    const wDiff = (parseFloat(latest.weight) - parseFloat(firstM.weight)).toFixed(1);
    const tiDiff = (calcTotalInches(latest) - calcTotalInches(firstM)).toFixed(1);
    const bfDiff = (parseFloat(latest.bodyFat || 0) - parseFloat(firstM.bodyFat || 0)).toFixed(1);
    
    html += `<div class="card mb-12">
      <div class="card-title mb-8">Overall Change</div>
      <div class="stat-grid stat-grid-3">
        <div class="stat-box">
          <div class="stat-value" style="color:${parseFloat(wDiff) < 0 ? 'var(--green)' : 'var(--red)'}">${wDiff > 0 ? '+' : ''}${wDiff}</div>
          <div class="stat-label">lbs</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" style="color:${parseFloat(tiDiff) < 0 ? 'var(--green)' : 'var(--accent2)'}">${tiDiff > 0 ? '+' : ''}${tiDiff}"</div>
          <div class="stat-label">Total Inches</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" style="color:${parseFloat(bfDiff) < 0 ? 'var(--green)' : 'var(--red)'}">${bfDiff > 0 ? '+' : ''}${bfDiff}%</div>
          <div class="stat-label">Body Fat</div>
        </div>
      </div>
    </div>`;
  }

  // Measurement details
  if (latest) {
    html += `<div class="card mb-12">
      <div class="card-title mb-8">Current Measurements</div>
      <div class="section-divider">Upper Body</div>`;
    [['Neck', 'neck'], ['Chest', 'chest'], ['Shoulders', 'shoulders'], ['Right Arm', 'rightArm'], ['Left Arm', 'leftArm']].forEach(([label, key]) => {
      if (latest[key]) {
        html += `<div class="flex-between" style="padding:6px 0;border-bottom:1px solid var(--border)">
          <div class="text-sm">${label}</div>
          <div class="mono text-sm">${latest[key]}"</div>
        </div>`;
      }
    });
    html += `<div class="section-divider">Core & Lower</div>`;
    [['Waist', 'waist'], ['Hips', 'hips'], ['Right Thigh', 'rightThigh'], ['Left Thigh', 'leftThigh'], ['Right Calf', 'rightCalf'], ['Left Calf', 'leftCalf']].forEach(([label, key]) => {
      if (latest[key]) {
        html += `<div class="flex-between" style="padding:6px 0;border-bottom:1px solid var(--border)">
          <div class="text-sm">${label}</div>
          <div class="mono text-sm">${latest[key]}"</div>
        </div>`;
      }
    });
    html += `<div class="section-divider"></div>
    <div class="flex-between">
      <div class="text-sm fw-600">Total Inches</div>
      <div class="mono text-sm text-accent">${calcTotalInches(latest).toFixed(1)}"</div>
    </div>
    </div>`;
  }

  // Strength progress
  if (db.workouts.filter(w => w.type === 'strength').length > 0) {
    html += `<div class="card mb-12">
      <div class="card-title mb-8">Strength Progress</div>`;
    G2F.exercises.slice(0, 4).forEach(ex => {
      const last = getExerciseData(ex.name);
      if (last) {
        html += `<div class="list-item">
          <div class="list-item-info">
            <h4>${ex.name}</h4>
            <p>${last.reps} reps</p>
          </div>
          <div class="list-item-meta text-accent">${last.weight} lbs</div>
        </div>`;
      }
    });
    html += `</div>`;
  }

  // Running progress
  if (db.running_log.length > 0) {
    const recentRuns = db.running_log.slice(-8);
    const avgDist = recentRuns.reduce((a,b) => a + (b.distance||0), 0) / recentRuns.length;
    html += `<div class="card mb-12">
      <div class="card-title mb-8">Running Progress</div>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-value">${recentRuns.length}</div>
          <div class="stat-label">Recent Runs</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" style="color:var(--accent2)">${avgDist.toFixed(1)}</div>
          <div class="stat-label">Avg Distance (mi)</div>
        </div>
      </div>
    </div>`;
  }

  // Nutrition compliance
  if (db.nutrition_log.length > 0) {
    const recent = db.nutrition_log.slice(-7);
    const compliant = recent.filter(d => d.compliant).length;
    html += `<div class="card mb-12">
      <div class="card-title mb-8">Nutrition Compliance (7 days)</div>
      <div class="flex-between mb-8">
        <div style="font-family:var(--display);font-size:36px;color:var(--accent)">${compliant}/7</div>
        <div class="text-sm text-muted">days on-plan</div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${compliant/7*100}%"></div></div>
    </div>`;
  }

  // Export data
  html += `<div class="card">
    <div class="card-title mb-8">Data</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary btn-sm" style="flex:1" onclick="exportData()">Export JSON</button>
      <button class="btn btn-secondary btn-sm" style="flex:1" onclick="importDataPrompt()">Import JSON</button>
    </div>
  </div>`;

  return html;
}

function openModal(html) {
  document.getElementById('modal-content').innerHTML = `<div class="modal-handle"></div>` + html;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
}

function closeModalDirect() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function openLogWeightModal() {
  const today_bw = db.settings.bodyweight;
  openModal(`
    <div class="modal-title">Log Bodyweight</div>
    <div class="form-group">
      <label class="form-label">Weight (lbs)</label>
      <input type="number" class="form-input" id="bw-input" value="${today_bw || ''}" step="0.1" placeholder="180.0" style="font-size:24px;text-align:center">
    </div>
    <div class="form-group">
      <label class="form-label">Time</label>

    </div>
    <button class="btn btn-primary btn-full" onclick="saveBodyweight()">Save</button>
  `);
}

function saveBodyweight() {
  const val = parseFloat(document.getElementById('bw-input').value);

  const todayM = db.measurements.find(m => m.date === today());

  closeModalDirect();
  refresh();
  showToast('Weight logged ✓');
}

function switchMealTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('meal-tab-from-db').style.display = tab === 'from-db' ? 'block' : 'none';
  document.getElementById('meal-tab-quick').style.display = tab === 'quick' ? 'block' : 'none';
}

function saveQuickMeal() {
  const name = document.getElementById('qm-name')?.value || 'Unnamed meal';
  const cal = parseInt(document.getElementById('qm-cal')?.value) || 0;
  const prot = parseInt(document.getElementById('qm-prot')?.value) || 0;
  const carbs = parseInt(document.getElementById('qm-carbs')?.value) || 0;
  const fat = parseInt(document.getElementById('qm-fat')?.value) || 0;
  
  const log = getOrCreateTodayNutrition();
  log.meals.push({ name, calories: cal, protein: prot, carbs, fat, quick: true, time: new Date().toTimeString().slice(0,5) });
  log.calories += cal;
  log.protein += prot;
  saveDB();
  closeModalDirect();
  refresh();
  showToast('Meal logged ✓');
}

function addMealToLog(mealId) {
  const meal = getMealById(mealId);
  if (!meal) return;
  const macros = calcMealMacros(meal);
  const log = getOrCreateTodayNutrition();
  log.meals.push({ name: meal.name, calories: macros.calories, protein: macros.protein, carbs: macros.carbs, fat: macros.fat, mealId, time: new Date().toTimeString().slice(0,5) });
  log.calories += macros.calories;
  log.protein += macros.protein;
  saveDB();
  refresh();
  showToast(`${meal.name} added ✓`);
}

function removeTodayMeal(idx) {
  const log = getTodayNutritionLog();
  if (!log) return;
  const meal = log.meals[idx];
  log.calories -= meal.calories || 0;
  log.protein -= meal.protein || 0;
  log.meals.splice(idx, 1);
  saveDB();
  refresh();
}

function importCSV() {
  const raw = document.getElementById('csv-data').value.trim();
  if (!raw) return;
  const lines = raw.split('\n').filter(l => l.trim());
  let count = 0;
  lines.forEach(line => {
    const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
    if (cols.length < 5) return;
    const [name, store, unitPrice, servings, protein, carbs, sugars, fiber, fat, satFat, sodium, servingUnit, servingSize] = cols;
    if (!name) return;
    db.ingredients.push({
      id: Date.now().toString() + Math.random().toString(36).slice(2,5),
      name, store,
      unitPrice: parseFloat(unitPrice) || 0,
      servingSize: parseFloat(servingSize) || 1,
      servingUnit: servingUnit || 'serving',
      protein: parseFloat(protein) || 0,
      carbs: parseFloat(carbs) || 0,
      sugars: parseFloat(sugars) || 0,
      fiber: parseFloat(fiber) || 0,
      fat: parseFloat(fat) || 0,
      satFat: parseFloat(satFat) || 0,
      sodium: parseFloat(sodium) || 0,
    });
    count++;
  });
  saveDB();
  closeModalDirect();
  navigate('nutrition');
  showToast(`Imported ${count} ingredients ✓`);
}

function exportIngredients() {
  const header = 'name,store,unitPrice,servings,protein,carbs,sugars,fiber,fat,satFat,sodium,servingUnit,servingSize\n';
  const rows = db.ingredients.map(i => [i.name,i.store,i.unitPrice,i.servings||1,i.protein,i.carbs,i.sugars||0,i.fiber||0,i.fat,i.satFat||0,i.sodium,i.servingUnit,i.servingSize].join(',')).join('\n');
  const blob = new Blob([header + rows], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '4hb-ingredients.csv';
  a.click();
}

function updateSetting(key, value) {

function toggleTrainingDay(day) {
  const days = db.settings.trainingDays;
  const idx = days.indexOf(day);
  if (idx >= 0) {
    days.splice(idx, 1);
  } else {
    days.push(day);
    days.sort((a,b) => a-b);
  }
  saveDB();
  regenerateSchedule();
  refresh();
}

function toggleMobilityArea(area) {
  const areas = db.settings.mobilityAreas;
  const idx = areas.indexOf(area);
  if (idx >= 0) {
    areas.splice(idx, 1);
  } else {
    areas.push(area);
  }
  saveDB();
  refresh();
}

function regenerateSchedule() {
  const t = today();
  const weekStart = getWeekStart(t);
  db.weekly_plan = generateWeeklySchedule(weekStart);
  db.currentWeek = weekStart;
  saveDB();
}

function deleteIngredient(id) {
  db.ingredients = db.ingredients.filter(i => i.id !== id);
  saveDB();
  refresh();
}

function deleteWorkoutLog(id) {
  db.workouts = db.workouts.filter(w => w.id !== id);

function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `4hb-backup-${today()}.json`;
  a.click();
}

function importDataPrompt() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        db = { ...DEFAULT_STATE, ...data, settings: { ...DEFAULT_SETTINGS, ...data.settings } };
        saveDB();
        refresh();
        showToast('Data imported ✓');
      } catch(err) {
        showToast('Import failed — invalid JSON');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function confirmReset() {
  if (confirm('Reset ALL data? This cannot be undone.')) {
    localStorage.removeItem(DB_KEY);
    db = { ...DEFAULT_STATE, settings: { ...DEFAULT_SETTINGS } };
    saveDB();
    refresh();
    showToast('Data reset');
  }
}

let currentPage = 'today';

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.page === page);
  });
  refresh();
  document.getElementById('main-content').scrollTop = 0;
}

function refresh() {
  const content = document.getElementById('main-content');
  switch(currentPage) {
    case 'today': content.innerHTML = renderToday(); break;
    case 'log': content.innerHTML = renderLog(); break;
    case 'nutrition': content.innerHTML = renderNutrition(); break;
    case 'progress': content.innerHTML = renderProgress(); break;
    case 'settings': content.innerHTML = renderSettings(); break;
    default: content.innerHTML = renderToday();
  }
}

// TOAST
// ═══════════════════════════════════════════════════════════════
function showToast(msg) {
  const existing = document.getElementById('toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.id = 'toast';
  t.textContent = msg;
  t.style.cssText = `
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #000;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    z-index: 300;
    animation: toastIn 0.2s ease;
    white-space: nowrap;
  `;
  const style = document.createElement('style');
  style.textContent = `@keyframes toastIn { from { opacity:0;transform:translateX(-50%) translateY(10px); } to { opacity:1;transform:translateX(-50%) translateY(0); } }`;
  document.head.appendChild(style);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

document.addEventListener('DOMContentLoaded', () => {
  // Regenerate schedule if new week
  const weekStart = getWeekStart(today());
  if (db.currentWeek !== weekStart) {
    regenerateSchedule();
  }
  
  refresh();
  
  // Show onboarding if first time
  if (!db.onboarded) {
    setTimeout(showOnboarding, 400);
  }
  
  // Handle back gesture on modal
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModalDirect();
  });
});

// Service worker for PWA
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/'])));
    });
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
    });
  `;
  const blob = new Blob([swCode], {type: 'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
</script>
